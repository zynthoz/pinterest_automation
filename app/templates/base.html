<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Pinterest Automation Tool — Create affiliate pins from Amazon products and TikTok videos">
    <title>{% block title %}Dashboard{% endblock %} — PinBot</title>
    <link rel="stylesheet" href="/static/css/main.css">
    {% block head %}{% endblock %}
</head>
<body>
    <div class="app-layout">
        <!-- Top Navigation Header -->
        <header class="navbar" id="navbar">
            <div class="navbar-container">
                <div class="navbar-brand">
                    <a href="/" class="logo-link">
                        <div class="logo-icon">
                            <svg viewBox="0 0 24 24" style="width:14px;height:14px;fill:currentColor;stroke:none;"><path d="M16 12V4h1V2H7v2h1v8l-2 2v2h5.2v6h1.6v-6H18v-2l-2-2z"/></svg>
                        </div>
                        <span class="logo-text">PinBot</span>
                    </a>
                </div>

                <nav class="navbar-nav">
                    <a href="/" class="nav-btn {% if active_page == 'dashboard' %}active{% endif %}" id="nav-dashboard">
                        Dashboard
                    </a>
                    <a href="/pins" class="nav-btn {% if active_page == 'pins' %}active{% endif %}" id="nav-pins">
                        Pins
                    </a>
                    <a href="/settings" class="nav-btn {% if active_page == 'settings' %}active{% endif %}" id="nav-settings">
                        Settings
                    </a>
                </nav>

                <div class="navbar-status">
                    <div class="connection-status-pill {% if pinterest_connected %}connected{% endif %}">
                        <span class="status-dot"></span>
                        <span class="status-text">{% if pinterest_connected %}Pinterest Connected{% else %}Pinterest Disconnected{% endif %}</span>
                    </div>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            {% block content %}{% endblock %}
        </main>
    </div>

    <!-- Toast Container -->
    <div class="toast-container" id="toast-container"></div>

    <!-- Slidesheet Drawer Overlay -->
    <div class="modal-overlay" id="modal-overlay">
        <div class="modal" id="modal">
            <div class="modal-header">
                <h3 class="modal-title" id="modal-title"></h3>
                <button class="btn-icon btn-secondary" onclick="closeModal()">
                    <svg class="icon icon-sm" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
            </div>
            <div class="modal-body" id="modal-body"></div>
            <div class="modal-footer" id="modal-footer"></div>
        </div>
    </div>

    <script src="/static/js/app.js?v=1.1"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
